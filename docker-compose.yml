services:
  backend:
    build:
      context: ./llmwrapper
    image: llmwrapper-backend:latest
    container_name: llmwrapper-backend
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/llmwrapper}
      DB_USERNAME: ${DB_USERNAME:-llmwrapper}
      DB_PASSWORD: ${DB_PASSWORD:-llmwrapper}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-must-be-at-least-32-bytes-long-for-hs256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: llmwrapper-frontend:latest
    container_name: llmwrapper-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: llmwrapper-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmwrapper}
      POSTGRES_USER: ${POSTGRES_USER:-llmwrapper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmwrapper}
    volumes:
      - llmwrapper-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-llmwrapper} -d $${POSTGRES_DB:-llmwrapper}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  llmwrapper-pgdata:
